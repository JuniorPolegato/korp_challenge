global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    environment: challenge
    project: projeto-korp

rule_files:
  - /etc/prometheus/rules/*.yml   # optional, safe if empty

scrape_configs:
  # Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The Go application: availability + request volume
  - job_name: http-server-projeto-korp
    metrics_path: /metrics
    static_configs:
      - targets: ["http-server-projeto-korp:8080"]
        labels:
          service: http-server-projeto-korp

  # Edge metrics from NGINX
  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  # End-to-end: through the proxy, into the app
  - job_name: blackbox-http-korp
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://nginx:80/projeto-korp
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # NGINX liveness only — never touches upstream
  - job_name: blackbox-http-nginx
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://nginx:80/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
