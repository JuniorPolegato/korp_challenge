name: projeto-korp

# ---------------------------------------------------------------------------
# Dedicated bridge network for inter-container communication
# ---------------------------------------------------------------------------
networks:
  korp-net:
    name: korp-net
    external: true
    # driver: bridge
    # ipam:
    #   config:
    #     - subnet: 172.28.0.0/16

volumes:
  prometheus-data:
    name: korp-prometheus-data
  grafana-data:
    name: korp-grafana-data

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # -------------------------------------------------------------------------
  # Application - NOT exposed to the host, reachable only through NGINX
  # -------------------------------------------------------------------------
  http-server-projeto-korp:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: korp/http-server-projeto-korp:${APP_VERSION:-dev}
    container_name: http-server-projeto-korp
    hostname: http-server-projeto-korp
    restart: unless-stopped
    environment:
      LISTEN_ADDR: ":8080"
      APP_VERSION: ${APP_VERSION:-dev}
    networks:
      - korp-net
    # No "ports:" on purpose - requirement of the challenge.
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    logging: *default-logging

  # -------------------------------------------------------------------------
  # Reverse proxy - the only public entry point (host:80)
  # -------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    depends_on:
      - http-server-projeto-korp
    ports:
      - "80:80"
    volumes:
      # Volume mounted exactly at /etc/nginx/conf.d/ as required.
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - korp-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # -------------------------------------------------------------------------
  # NGINX metrics exporter (bonus: edge-level request volume)
  # -------------------------------------------------------------------------
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3
    container_name: nginx-exporter
    restart: unless-stopped
    depends_on:
      - nginx
    command:
      - --nginx.scrape-uri=http://nginx:80/nginx_status
    networks:
      - korp-net
    expose:
      - "9113"
    logging: *default-logging

  # -------------------------------------------------------------------------
  # Blackbox exporter (bonus: true black-box availability probing)
  # -------------------------------------------------------------------------
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: blackbox-exporter
    restart: unless-stopped
    networks:
      - korp-net
    expose:
      - "9115"
    logging: *default-logging

  # -------------------------------------------------------------------------
  # Prometheus - metrics collection
  # -------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    restart: unless-stopped
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"      # exposed for inspection during the demo
    networks:
      - korp-net
    logging: *default-logging

  # -------------------------------------------------------------------------
  # Grafana - dashboards, fully provisioned from files
  # -------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.3.1
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/http-server-projeto-korp-dashboard.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - "korp-net"
    logging: *default-logging
