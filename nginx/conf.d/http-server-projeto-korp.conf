# Reverse proxy: host:80 -> http-server-projeto-korp:8080

upstream korp_backend {
    # Container name resolved by the Docker embedded DNS on the bridge network.
    server http-server-projeto-korp:8080 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Basic hardening
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    access_log /var/log/nginx/korp_access.log;
    error_log  /var/log/nginx/korp_error.log warn;

    # NGINX-only liveness — handled locally, no upstream
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Main application endpoint
    location /projeto-korp {
        proxy_pass http://korp_backend/projeto-korp;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout    10s;
    }

    # Availability endpoint of the Go service, proxied for external probing
    location /healthz {
        proxy_pass http://korp_backend/healthz;
        proxy_set_header Host $host;
    }

    # NGINX own status page, scraped by the nginx-exporter
    location /nginx_status {
        stub_status;
        access_log off;
        allow 172.16.0.0/12;   # Docker bridge networks only
        allow 127.0.0.1;
        deny all;
    }

    location = / {
        return 302 /projeto-korp;
    }
}
